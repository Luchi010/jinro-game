<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>人狼ゲーム</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho:wght@600;800&display=swap">
<style>
:root{--bg:#0b0a14;--ink:#efe8dc;--gold:#d3ab5f;--panel:rgba(18,14,30,.86)}
*{box-sizing:border-box}
html,body{margin:0;height:100%;background:var(--bg);color:var(--ink);font-family:"Shippori Mincho","Hiragino Mincho ProN","Noto Serif JP",serif;overflow:hidden;touch-action:none}
#stage,#stage canvas{position:fixed;inset:0;width:100%;height:100%;display:block}
#home{position:fixed;inset:0;display:flex;flex-direction:column;justify-content:space-between;align-items:center;padding:calc(48px + env(safe-area-inset-top,0px)) 20px calc(28px + env(safe-area-inset-bottom,0px));pointer-events:none}
#version{position:fixed;right:14px;bottom:calc(10px + env(safe-area-inset-bottom,0px));color:rgba(239,232,220,.58);font:12px sans-serif;letter-spacing:.08em;pointer-events:none}
h1{margin:0;font-weight:800;font-size:clamp(40px,12vw,76px);letter-spacing:.18em;padding-left:.18em;color:var(--gold);text-shadow:0 0 28px rgba(211,171,95,.35)}
.actions{width:min(380px,100%);display:flex;flex-direction:column;gap:12px;pointer-events:auto}
button{font-family:inherit;cursor:pointer}
.big{height:58px;border-radius:14px;border:1px solid var(--gold);background:var(--gold);color:#1a1405;font-size:20px;font-weight:800;letter-spacing:.1em}
.big.alt{background:var(--panel);color:var(--gold)}
.pane{display:flex;gap:10px;align-items:center;background:var(--panel);border:1px solid rgba(211,171,95,.4);border-radius:14px;padding:10px}
.pane[hidden]{display:none}
.stepper{flex:1;display:flex;align-items:center;justify-content:space-between;font-size:22px}
.stepper button{width:44px;height:44px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--gold);font-size:24px}
.go{height:44px;padding:0 20px;border-radius:10px;border:0;background:var(--gold);color:#1a1405;font-weight:800;font-size:16px}
input{flex:1;min-width:0;height:44px;border-radius:10px;border:1px solid rgba(211,171,95,.5);background:rgba(0,0,0,.35);color:var(--ink);font-size:18px;letter-spacing:.2em;padding:0 12px;text-transform:uppercase;font-family:inherit}
input::placeholder{letter-spacing:0;text-transform:none;opacity:.5}
#msg{margin:0;min-height:1.2em;text-align:center;color:#ff9a9a;font-size:14px}
#hud{position:fixed;top:0;left:0;right:0;display:flex;flex-wrap:wrap;gap:6px;align-items:center;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0}
#home[hidden],#hud[hidden],#phase[hidden],#chat[hidden],#act[hidden],.ov[hidden]{display:none}
#hud button,#hud span{background:var(--panel);border:1px solid rgba(211,171,95,.45);color:var(--ink);border-radius:10px;padding:7px 9px;font-size:14px}
#hud button[hidden]{display:none}
#hud #npcBtn.on{background:var(--gold);color:#1a1405}
#rid{letter-spacing:.2em;color:var(--gold);font-weight:800;font-size:20px}
#cnt{margin-right:auto}

#nameIn{flex:none;width:100%;letter-spacing:.05em;text-transform:none;background:var(--panel)}
#phase{position:fixed;top:calc(64px + env(safe-area-inset-top,0px));left:0;right:0;text-align:center;pointer-events:none;font-size:17px;color:var(--gold);text-shadow:0 1px 6px #000}
#chat{position:fixed;left:10px;right:10px;bottom:calc(10px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:6px}
#act{background:var(--panel);border:1px solid rgba(211,171,95,.45);border-radius:12px;padding:8px;display:flex;flex-wrap:wrap;gap:6px;font-size:14px}
#act div{width:100%;color:var(--gold)}
#act button{padding:8px 12px;border-radius:8px;border:1px solid var(--gold);background:none;color:var(--ink);font-size:15px}
#act button.on{background:var(--gold);color:#1a1405}
#log{max-height:22vh;overflow:auto;touch-action:pan-y;background:var(--panel);border-radius:10px;padding:6px 10px;font-size:14px;line-height:1.5}
#log:empty{display:none}#log .sys{color:var(--gold)}#log .me{color:#9fd3ff}
#chatRow{display:flex;gap:6px}#chatRow input{letter-spacing:0;text-transform:none;font-size:16px;background:var(--panel)}
.ov{position:fixed;inset:0;background:rgba(5,4,12,.86);display:flex;align-items:center;justify-content:center}
.rcard{width:min(280px,72vw);min-height:360px;border:3px solid var(--gold);border-radius:14px;background:linear-gradient(#3a2a66,#1a1233);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:14px;padding:18px;text-align:center;animation:flip .5s}
@keyframes flip{from{transform:rotateY(90deg)}to{transform:none}}
.rcard b{font-size:38px;color:var(--gold)}.rcard p{margin:0;font-size:15px;white-space:pre-line;line-height:1.7}.rcard small{opacity:.6}
#pCreate{flex-direction:column;align-items:stretch}
.row{display:flex;align-items:center;justify-content:space-between;font-size:19px}
.row div{display:flex;align-items:center;gap:14px}.row b{min-width:1.5em;text-align:center;font-size:22px}
.row button{width:40px;height:40px;border-radius:50%;border:1px solid var(--gold);background:none;color:var(--gold);font-size:22px}
.total{text-align:right;font-size:14px;opacity:.8}
#bubble{position:fixed;left:0;top:0;display:flex;gap:6px;transform:translate(-50%,-100%);z-index:5}
#bubble[hidden]{display:none}
#toast{position:fixed;left:50%;top:38%;transform:translateX(-50%);background:var(--panel);border:1px solid var(--gold);padding:10px 16px;border-radius:12px;font-size:15px;z-index:9;pointer-events:none;max-width:80vw;text-align:center}
#toast[hidden]{display:none}
#death{position:fixed;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(70,0,0,.72);color:#ffb0b0;font-family:serif;font-size:clamp(64px,20vw,150px);font-weight:800;letter-spacing:.12em;text-shadow:0 0 24px #f00,4px 4px 0 #300;z-index:20;pointer-events:none;animation:deathFlash .7s ease-out}
#death small{font-size:clamp(16px,4vw,28px);letter-spacing:.12em;color:#fff;margin-top:12px}
#death[hidden]{display:none}
@keyframes deathFlash{0%{opacity:0;transform:scale(1.5)}45%{opacity:1;transform:scale(1)}100%{opacity:1}}
#bubble button{padding:9px 16px;border-radius:10px;border:1px solid var(--gold);background:var(--panel);color:var(--ink);font-size:17px;font-weight:800;box-shadow:0 2px 10px #000a}
#bubble button.kill{background:#8a1c1c;border-color:#ff8a8a}
/* 移動スティック・チートメニュー */
#stick{position:fixed;left:18px;bottom:calc(24vh + 74px + env(safe-area-inset-bottom,0px));width:124px;height:124px;border-radius:50%;background:rgba(18,14,30,.45);border:2px solid rgba(211,171,95,.5);touch-action:none;z-index:7}
#stick[hidden]{display:none}
#stick i{position:absolute;left:50%;top:50%;width:52px;height:52px;margin:-26px 0 0 -26px;border-radius:50%;background:rgba(211,171,95,.75);pointer-events:none}
#cheat{position:fixed;left:8px;right:8px;top:calc(58px + env(safe-area-inset-top,0px));max-height:62vh;overflow:auto;touch-action:pan-y;background:rgba(14,11,26,.94);border:1px solid var(--gold);border-radius:14px;padding:10px 12px;z-index:8;font-size:15px}
#cheat[hidden]{display:none}
#cheat h4{margin:12px 0 6px;color:var(--gold);font-size:14px}
#cheat h4:first-child{margin-top:0}
#cheat .g{display:flex;flex-wrap:wrap;gap:6px}
#cheat button{padding:8px 11px;border-radius:8px;border:1px solid var(--gold);background:none;color:var(--ink);font-size:14px}
#cheat button.on{background:var(--gold);color:#1a1405}
#cheat button.sel{background:#2d4a66;border-color:#9fd3ff}
#cheat .sw{display:flex;align-items:center;justify-content:space-between;margin:4px 0;gap:8px}
#cheat .sw button{min-width:64px}
</style>
<script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
<script>window.Peer||document.write('<script src="https://cdn.jsdelivr.net/npm/peerjs@1.5.2/dist/peerjs.min.js"><\/script>')</script>

<body>
<div id="stage"></div>
<main id="home">
  <h1>人狼ゲーム</h1>
  <div id="version">ver. 1.5.0</div>
  <div class="actions">
    <input id="nameIn" maxlength="8" placeholder="プレイヤー名" autocomplete="off">
    <button class="big" id="bCreate">部屋を作る</button>
    <div class="pane" id="pCreate" hidden>
      <div class="row" data-k="wolf"><span>人狼</span><div><button data-d="-1">−</button><b>0</b><button data-d="1">＋</button></div></div>
      <div class="row" data-k="knight"><span>騎士</span><div><button data-d="-1">−</button><b>0</b><button data-d="1">＋</button></div></div>
      <div class="row" data-k="seer"><span>占い師</span><div><button data-d="-1">−</button><b>0</b><button data-d="1">＋</button></div></div>
      <div class="row" data-k="sheriff"><span>保安官</span><div><button data-d="-1">−</button><b>0</b><button data-d="1">＋</button></div></div>
      <div class="row" data-k="madman"><span>狂人</span><div><button data-d="-1">−</button><b>0</b><button data-d="1">＋</button></div></div>
      <div class="row" data-k="villager"><span>市民</span><div><button data-d="-1">−</button><b>0</b><button data-d="1">＋</button></div></div>
      <div class="total">合計 <b id="tot">6</b>人（揃わなくても強制スタート可）</div>
      <button class="go" id="goCreate">作成</button>
    </div>
    <button class="big alt" id="bJoin">部屋に入る</button>
    <div class="pane" id="pJoin" hidden>
      <input id="ridIn" maxlength="6" placeholder="部屋ID（例 XCDFR）" autocapitalize="characters" autocomplete="off">
      <button class="go" id="goJoin">参加</button>
    </div>
    <p id="msg"></p>
  </div>
</main>
<div id="bubble" hidden></div>
<div id="stick" hidden><i></i></div>
<div id="cheat" hidden></div>
<div id="toast" hidden></div>
<div id="death" hidden>死亡した<small>あなたは脱落しました</small></div>
<div id="hud" hidden><button id="rid" title="タップでコピー"></button><span id="cnt"></span><button id="npcBtn" hidden>NPC OFF</button><button id="roleBtn" hidden>役職</button><button id="cheatBtn" hidden>☰</button><button id="leave">退出</button></div>
<div id="phase" hidden><span id="phaseTxt"></span> <b id="timer"></b></div>
<div id="chat" hidden><div id="act" hidden></div><div id="log"></div><div id="chatRow"><input id="chatIn" maxlength="60" placeholder="発言（昼の話し合い）" autocomplete="off"><button class="go" id="chatSend">送信</button><button class="go" id="dayPass" hidden>昼をパス</button></div></div>
<div id="role" class="ov" hidden><div class="rcard"><small>あなたにしか見えません</small><b id="roleName"></b><p id="roleInfo"></p><small>タップで閉じる</small></div></div>
<div id="result" class="ov" hidden><div class="rcard"><b id="resTitle"></b><p id="resList"></p><small>タップで閉じる</small></div></div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// 人型キャラクターと椅子。番号ごとに髪型・肌・服・アクセサリの組み合わせが決まる
const V=(x,y,z)=>new THREE.Vector3(x,y,z);
const M=(c,r=.7)=>new THREE.MeshStandardMaterial({color:c,roughness:r});
const woodMat=M(0x5a3b25,.65), darkMat=new THREE.MeshBasicMaterial({color:0x2a1a1a}), whiteB=new THREE.MeshBasicMaterial({color:0xffffff}), blushMat=new THREE.MeshBasicMaterial({color:0xff9aa8,transparent:true,opacity:.45});
const HAIR=[0x4a3225,0xe8b04a,0xd9607e,0x5a6bd0,0xdfe3ea,0x3a9a7a,0x8a5acb,0xd0702a];
const SKIN=[0xffe0cc,0xf6c7a5,0xe3a77d,0xc98a62,0x9a6a47,0xffeadd];
const EYEC=[0x2a1a1a,0x2f6fd0,0x2a9a6a,0x8a4ad0,0xb05a3a,0x6a4a2a,0x1aa8c8,0xd0a030];
const NAMES=['ミコト','ルナ','ハル','ソラ','ココ','レン','ユイ','ノア','リク','モモ','カイ','サクラ','トア','ミナ','ロウ','アオイ'];
const ball=(r,m,x,y,z,sx=1,sy=1,sz=1)=>{const o=new THREE.Mesh(new THREE.SphereGeometry(r,16,12),m);o.position.set(x,y,z);o.scale.set(sx,sy,sz);return o;};
function limb(a,b,r,m,r2){const d=new THREE.Vector3().subVectors(b,a),o=new THREE.Mesh(new THREE.CylinderGeometry(r2||r,r,d.length(),10),m);o.position.copy(a).add(b).multiplyScalar(.5);o.quaternion.setFromUnitVectors(V(0,1,0),d.normalize());return o;}
function label(text,color='#efe8dc'){
  const c=document.createElement('canvas');c.width=256;c.height=64;const x=c.getContext('2d');
  x.fillStyle='rgba(20,17,34,.8)';x.beginPath();x.roundRect?x.roundRect(4,8,248,48,14):x.rect(4,8,248,48);x.fill();
  x.fillStyle=color;x.font='bold 26px sans-serif';x.textAlign='center';x.textBaseline='middle';x.fillText(text,128,33);
  const s=new THREE.Sprite(new THREE.SpriteMaterial({map:new THREE.CanvasTexture(c),transparent:true,depthTest:false}));s.scale.set(1.2,.3,1);return s;
}
function makeChair(){
  const g=new THREE.Group();
  const seat=new THREE.Mesh(new THREE.BoxGeometry(.8,.1,.8),woodMat);seat.position.y=.5;
  const back=new THREE.Mesh(new THREE.BoxGeometry(.8,.9,.08),woodMat);back.position.set(0,1,-.4);g.add(seat,back);
  [[-.35,-.35],[.35,-.35],[-.35,.35],[.35,.35]].forEach(([x,z])=>{const l=new THREE.Mesh(new THREE.BoxGeometry(.08,.5,.08),woodMat);l.position.set(x,.25,z);g.add(l);});
  return g;
}
function makeCharacter(i,name,red=false){
  const g=new THREE.Group();
  const sk=M(SKIN[(i*5)%6],.75), hair=M(HAIR[(i*3)%8],.55), hue=(i*.618)%1;
  const outfit=M(new THREE.Color().setHSL(hue,.45+(i%3)*.1,.45)), acc=M(new THREE.Color().setHSL((hue+.5)%1,.65,.5));
  const pants=M(new THREE.Color().setHSL(.62,.2,.2+(i%4)*.05)), white=M(0xf4efe6), shoe=M(0x222222);
  const style=(i+(i>>3))%6, ac=(i*3+1)%7, of=(i*2+(i>>2))%4;
  // 胴・首・肩
  const torso=new THREE.Mesh(new THREE.CylinderGeometry(.2,.17,.52,18),of===2?white:outfit);torso.scale.z=.62;torso.position.y=.86;g.add(torso);
  g.add(ball(.075,outfit,.2,1.07,0,1,1,.9),ball(.075,outfit,-.2,1.07,0,1,1,.9),limb(V(0,1.1,0),V(0,1.22,0),.05,sk));
  if(of===0){const c=new THREE.Mesh(new THREE.TorusGeometry(.09,.02,8,16),white);c.rotation.x=Math.PI/2;c.position.y=1.13;g.add(c);}
  if(of===1){g.add(ball(.1,outfit,0,1.13,-.09,1,.8,.8));const p=new THREE.Mesh(new THREE.BoxGeometry(.2,.1,.02),M(0x00000,.9));p.material.color.copy(outfit.color).multiplyScalar(.75);p.position.set(0,.7,.125);g.add(p);}
  if(of===2){const t=new THREE.Mesh(new THREE.BoxGeometry(.035,.22,.012),acc);t.position.set(0,.98,.127);g.add(t);}
  if(of===3)[.72,.86,1].forEach(y=>g.add(ball(.014,white,0,y,.126)));
  // 腕・脚（右腕は看板を持つとき隠せるよう専用グループにする）
  let ra=null;
  [-1,1].forEach(s=>{
    const arm=[limb(V(s*.21,1.07,0),V(s*.27,.86,.22),.045,outfit),limb(V(s*.27,.86,.22),V(s*.15,1.11,.55),.04,outfit),ball(.045,sk,s*.15,1.11,.58)];
    if(s<0){ra=new THREE.Group();arm.forEach(o=>ra.add(o));g.add(ra);}else arm.forEach(o=>g.add(o));
    g.add(limb(V(s*.09,.62,0),V(s*.1,.6,.4),.065,pants),limb(V(s*.1,.6,.4),V(s*.1,.12,.44),.05,pants),ball(.06,shoe,s*.1,.07,.5,1,.7,1.7));
  });
  // 頭
  const head=new THREE.Group();head.position.set(0,1.34,.02);
  head.add(ball(.115,sk,0,0,0,.92,1.08,1));
  const cap=new THREE.Mesh(new THREE.SphereGeometry(.125,20,14,0,Math.PI*2,0,Math.PI*.56),hair);cap.position.set(0,.015,-.012);head.add(cap);
  if(style!==5)for(let k=-2;k<=2;k++)head.add(ball(.03,hair,k*.04,.085-Math.abs(k)*.008,.085,1,1.5,.6));
  if(style===0)head.add(ball(.11,hair,0,-.02,-.035,1,1,.8));
  if(style===1){head.add(ball(.11,hair,0,-.15,-.05,1,2.2,.7));[-1,1].forEach(s=>head.add(ball(.04,hair,s*.11,-.07,.01,.7,2.2,.8)));}
  if(style===2){head.add(ball(.11,hair,0,-.02,-.04,1,1,.8));[-1,1].forEach(s=>{head.add(ball(.035,acc,s*.13,.02,-.04));const t=new THREE.Mesh(new THREE.ConeGeometry(.04,.22,8),hair);t.rotation.z=Math.PI;t.position.set(s*.14,-.1,-.04);head.add(t);});}
  if(style===3){head.add(ball(.11,hair,0,-.01,-.04,1,1,.8));head.add(ball(.035,acc,0,.07,-.13));const t=new THREE.Mesh(new THREE.ConeGeometry(.04,.24,8),hair);t.rotation.z=Math.PI;t.position.set(0,-.07,-.15);head.add(t);}
  if(style===4){head.add(ball(.11,hair,0,-.02,-.035,1,1,.8));head.add(ball(.05,hair,0,.14,-.03));}
  if(style===5)for(let k=0;k<7;k++){const a=k/7*Math.PI*2,c=new THREE.Mesh(new THREE.ConeGeometry(.035,.1,6),hair);c.position.set(Math.sin(a)*.09,.13,Math.cos(a)*.08);c.rotation.set(Math.cos(a)*.5,0,-Math.sin(a)*.5);head.add(c);}
  // 顔
  const eyes=[],irisM=new THREE.MeshBasicMaterial({color:EYEC[(i*7)%8]});
  [-1,1].forEach(s=>{
    const e=new THREE.Group();e.position.set(s*.045,.015,.105);
    e.add(ball(.02,whiteB,0,0,0,1,1,.5),ball(.013,irisM,0,0,.008,1,1.1,.5),ball(.006,darkMat,0,0,.012,1,1.1,.5));head.add(e);eyes.push(e);
    const b=new THREE.Mesh(new THREE.BoxGeometry(.04,.008,.008),hair);b.position.set(s*.045,.055,.105);b.rotation.z=s*.12;head.add(b);
    head.add(ball(.02,blushMat,s*.07,-.03,.1,1.3,.7,.4),ball(.025,sk,s*.113,0,0,.5,1,1));
  });
  head.add(ball(.013,sk,0,-.012,.118,1,1,.8));
  const mt=i%3;
  if(mt===1){const m=new THREE.Mesh(new THREE.BoxGeometry(.04,.006,.006),darkMat);m.position.set(0,-.05,.11);head.add(m);}
  else if(mt===2)head.add(ball(.014,darkMat,0,-.052,.108,1,1.2,.4));
  else{const m=new THREE.Mesh(new THREE.TorusGeometry(.022,.004,6,12,Math.PI),darkMat);m.rotation.z=Math.PI;m.position.set(0,-.04,.108);head.add(m);}
  // アクセサリ
  const n0=head.children.length,decor=[];
  if(ac===1){[-1,1].forEach(s=>{const r=new THREE.Mesh(new THREE.TorusGeometry(.03,.004,6,18),darkMat);r.position.set(s*.045,.015,.118);head.add(r);});const br=new THREE.Mesh(new THREE.BoxGeometry(.03,.004,.004),darkMat);br.position.set(0,.02,.12);head.add(br);}
  if(ac===2){head.add(new THREE.Mesh(new THREE.TorusGeometry(.125,.009,6,24,Math.PI),acc));[-1,1].forEach(s=>{const c=new THREE.Mesh(new THREE.CylinderGeometry(.035,.035,.025,12),acc);c.rotation.z=Math.PI/2;c.position.set(s*.125,0,0);head.add(c);});}
  if(ac===3){const h=new THREE.Mesh(new THREE.SphereGeometry(.13,20,12,0,Math.PI*2,0,Math.PI*.5),acc);h.position.y=.04;const br=new THREE.Mesh(new THREE.BoxGeometry(.16,.01,.09),acc);br.position.set(0,.045,.13);head.add(h,br);}
  if(ac===4){const sc=new THREE.Mesh(new THREE.TorusGeometry(.085,.03,8,16),acc);sc.rotation.x=Math.PI/2;sc.position.set(0,1.15,0);g.add(sc);decor.push(sc);}
  if(ac===5){const m=new THREE.Mesh(new THREE.BoxGeometry(.1,.05,.02),white);m.position.set(0,-.045,.105);head.add(m);}
  if(ac===6)head.add(ball(.03,darkMat,-.045,.015,.115,1,1,.4));
  head.children.slice(n0).forEach(o=>decor.push(o));
  head.traverse(m=>{m.castShadow=true;});
  g.add(head);
  const tag=label(name||NAMES[i%16],red?'#ff7070':'#efe8dc');tag.position.set(0,1.85,0);g.add(tag);
  g.userData={head,tag,eyes,decor,ra,outfit,sk,tagRed:red};
  return g;
}

// 通信層。PeerJS（WebRTC P2P）でオンライン接続し、使えない環境では同じブラウザのタブ間（BroadcastChannel）で動く。
// 構成: 作成者(host)が中心になり、参加者(client)はhostにだけ接続する。部屋とゲームの状態はhostが管理する。
const ID_CHARS='ABCDEFGHJKLMNPQRSTUVWXYZ';
const PEER_PREFIX='werewolf3d-';   // 部屋ID XCDFR → PeerJSのID "werewolf3d-XCDFR"
const PEER_OPTS={host:'0.peerjs.com',port:443,path:'/',secure:true,
  config:{iceServers:[{urls:'stun:stun.l.google.com:19302'},{urls:'stun:stun1.l.google.com:19302'}]}};
const genRoomId=()=>Array.from({length:5},()=>ID_CHARS[Math.random()*ID_CHARS.length|0]).join('');

// ---- PeerJS版 ----
class PeerHost{
  constructor(roomId,onMsg,onReady,onErr){
    this.conns={};
    this.peer=new Peer(PEER_PREFIX+roomId,PEER_OPTS);          // 部屋IDそのものをPeer IDにする
    this.peer.on('open',onReady);
    this.peer.on('error',onErr);
    this.peer.on('disconnected',()=>{try{this.peer.reconnect();}catch(_){}});   // 管理サーバーとの接続が切れたら再接続
    this.peer.on('connection',c=>{                              // 参加者がつないできた
      c.on('data',m=>{if(m.from){c._pid=m.from;this.conns[m.from]=c;}onMsg(m);});
      c.on('close',()=>{if(c._pid){delete this.conns[c._pid];onMsg({t:'leave',from:c._pid});}});
    });
  }
  broadcast(m){Object.values(this.conns).forEach(c=>c.open&&c.send(m));}
  sendTo(id,m){const c=this.conns[id];c&&c.open&&c.send(m);}
  close(){this.peer.destroy();}
}
class PeerClient{
  constructor(roomId,onMsg,onReady,onErr){
    this.peer=new Peer(PEER_OPTS);                              // 参加者のIDは自動発行
    this.peer.on('error',onErr);
    this.peer.on('open',()=>{
      this.conn=this.peer.connect(PEER_PREFIX+roomId,{serialization:'json',reliable:true});
      this.conn.on('open',onReady);
      this.conn.on('data',onMsg);
      this.conn.on('close',()=>this.onClose&&this.onClose());   // ホストが退出/切断した
    });
  }
  toHost(m){this.conn&&this.conn.open&&this.conn.send(m);}
  close(){this.peer.destroy();}
}
// ---- タブ間版（PeerJSが使えない時の代わり）----
class BCHost{
  constructor(id,onMsg){this.bc=new BroadcastChannel('werewolf-'+id);this.bc.onmessage=e=>e.data.dst==='host'&&onMsg(e.data.m);}
  broadcast(m){this.bc.postMessage({dst:'*',m});}
  sendTo(id,m){this.bc.postMessage({dst:id,m});}
  close(){this.bc.close();}
}
class BCClient{
  constructor(id,me,onMsg){this.bc=new BroadcastChannel('werewolf-'+id);this.bc.onmessage=e=>{const d=e.data;if(d.dst==='*'||d.dst===me)onMsg(d.m);};}
  toHost(m){this.bc.postMessage({dst:'host',m});}
  close(){this.bc.close();}
}
const hasPeer=()=>typeof Peer!=='undefined';
function openHost(id,onMsg){
  return new Promise((ok,ng)=>{
    if(!hasPeer())return ok({t:new BCHost(id,onMsg),online:false});
    let done=false;
    const fallback=()=>{if(done)return;done=true;try{h.close();}catch(_){}ok({t:new BCHost(id,onMsg),online:false});};
    const h=new PeerHost(id,onMsg,()=>{done=true;ok({t:h,online:true});},e=>{
      if(e.type==='unavailable-id'&&!done){done=true;try{h.close();}catch(_){}ng('taken');}else fallback();});
    setTimeout(fallback,8000);
  });
}
function openClient(id,me,onMsg){
  return new Promise((ok,ng)=>{
    if(!hasPeer())return ok({t:new BCClient(id,me,onMsg),online:false});
    let done=false;
    const c=new PeerClient(id,onMsg,()=>{done=true;ok({t:c,online:true});},e=>{
      if(done)return;done=true;try{c.close();}catch(_){}
      if(e.type==='peer-unavailable')ng(new Error('部屋が見つかりません'));
      else ok({t:new BCClient(id,me,onMsg),online:false});
    });
    setTimeout(()=>{if(!done){done=true;try{c.close();}catch(_){}ng(new Error('接続できませんでした'));}},8000);
  });
}

class Room{
  constructor(){
    this.me=Math.random().toString(36).slice(2,8);this.name='';this.state=null;this.host=false;this.joined=false;this.game=null;this.online=false;
    this.onState=this.onPriv=this.onChat=this.onHostLeft=this.onLook=this.onPos=this.onFx=()=>{};
    this.cx={ch:new Set(),inv:new Set(),vm:{}};this.npcSeq=0;this.npcOn=false;   // チート状態（hostだけが持つ）
    addEventListener('beforeunload',()=>this.leave());
  }
  async create(cfg,name){
    this.name=name;this.host=true;
    for(let k=0;k<5&&!this.id;k++){
      const id=genRoomId();
      try{const r=await openHost(id,m=>this._on(m));this.t=r.t;this.online=r.online;this.id=id;}
      catch(e){if(e!=='taken')throw e;}
    }
    if(!this.id)throw new Error('部屋IDを発行できませんでした');
    const max=Object.values(cfg).reduce((a,b)=>a+b,0);
    this.state={id:this.id,max,cfg,started:false,players:[{id:this.me,name}]};
    // オフライン時は空席をNPCで埋める（人が参加するとNPCと入れ替わる）。オンラインでは「NPC」ボタンで切り替え
    if(!this.online)this.fillNpc(true);
  }
  async join(id,name){
    this.name=name;this.id=id;
    const r=await openClient(id,this.me,m=>this._on(m));this.t=r.t;this.online=r.online;
    if(this.online)this.t.onClose=()=>this.onHostLeft();
    return new Promise((ok,ng)=>{
      this._ok=ok;this._ng=e=>{try{this.t.close();}catch(_){}ng(e);};this.t.toHost({t:'join',from:this.me,name,ch:!!cheater});
      setTimeout(()=>{if(!this.joined){this.t.close();ng(new Error('部屋が見つからないか、満員です'));}},3000);
    });
  }
  _on(m){
    if(this.host){
      const s=this.state;
      if(m.t==='join'){
        if(m.ch)this.cx.ch.add(m.from);
        const known=s.players.some(p=>p.id===m.from);
        if(!known&&s.started){this.t.sendTo(m.from,{t:'reject',reason:'started'});return;}   // 開始後は入れない
        if(!known&&s.players.length>=s.max){
          const k=s.players.findIndex(p=>p.npc);   // 満員でもNPCがいれば入れ替わる
          if(k<0){this.t.sendTo(m.from,{t:'reject',reason:'full'});return;}
          s.players[k]={id:m.from,name:m.name};this._pub();return;
        }
        if(!known)s.players.push({id:m.from,name:m.name});
        this._pub();
      }else if(m.t==='leave'){
        if(!s.started){s.players=s.players.filter(p=>p.id!==m.from);if(this.npcOn)this.fillNpc(true);}
        else{const p=s.players.find(x=>x.id===m.from);if(!p||p.alive===false)return;p.alive=false;if(this.game){this.game.onLeave(p.id);return;}}
        this._pub();
      }else if(m.t==='act'&&this.game)this.game.act(m);
      else if(m.t==='chat'){this.onChat(m);this.t.broadcast(m);}   // 発言は全員に中継
      else if(m.t==='look'){this.onLook(m);this.t.broadcast(m);}else if(m.t==='pos'){this.onPos(m);this.t.broadcast(m);}else if(m.t==='cx')this._cheat(m);   // 視線・位置も全員に中継
      return;
    }
    if(m.t==='reject'){if(this._ng){const g=this._ng;this._ng=null;g(new Error(m.reason==='started'?'もう開始されています':'満員です'));}}
    else if(m.t==='chat')this.onChat(m);
    else if(m.t==='look')this.onLook(m);
    else if(m.t==='pos')this.onPos(m);
    else if(m.t==='fx')this.onFx(m);
    else if(m.t==='priv'){if(m.to===this.me)this.onPriv(m);}
    else if(m.t==='state'){
      this.state=m.s;
      if(!this.joined&&m.s.players.some(p=>p.id===this.me)){this.joined=true;this._ok(m.s);}
      if(this.joined)this.onState(m.s);
    }
  }
  _pub(){this.t.broadcast({t:'state',s:this.state});this.onState(this.state);}
  // NPCで空席を埋める／全員外す（開始前のみ）
  fillNpc(on){
    const s=this.state;this.npcOn=on;
    if(!on){s.players=s.players.filter(p=>!p.npc);return;}
    let i=0;
    while(s.players.length<s.max){
      const n=NAMES.find(x=>!s.players.some(p=>p.name===x))||'NPC'+(++i);
      s.players.push({id:'npc'+(++this.npcSeq),name:n,npc:true});
    }
  }
  setNpc(on){if(!this.host||this.state.started)return;this.fillNpc(on);this._pub();}
  // ---- チート（部屋ID末尾に > を付けて参加した人だけ。チャットやログには一切出さない）----
  cheat(k,o){const m=Object.assign({t:'cx',from:this.me,k},o);this.host?this._cheat(m):this.t.toHost(m);}
  pos(o){const m=Object.assign({t:'pos',from:this.me},o);this.host?this.t.broadcast(m):this.t.toHost(m);}
  _fx(o){const m=Object.assign({t:'fx'},o);this.t.broadcast(m);this.onFx(m);}
  _cheat(m){
    const x=this.cx,s=this.state,g=this.game;if(!s||!x.ch.has(m.from))return;
    const pl=id=>s.players.find(p=>p.id===id),me=pl(m.from),tg=pl(m.target);
    switch(m.k){
      case 'inv':m.on?x.inv.add(m.from):x.inv.delete(m.from);break;
      case 'vw':x.vm[m.from]=Math.max(1,Math.min(99,m.n|0||1));break;
      case 'club':this._fx({k:'club',from:m.from,on:!!m.on});break;
      case 'peek':
        if(g&&tg&&g.role[tg.id]){this.priv(m.from,{peek:{name:tg.name,role:g.role[tg.id]}});this._fx({k:'take',target:tg.id,by:m.from});}
        break;
      case 'smash':
        if(tg&&me&&tg.id!==me.id){
          this._fx({k:'smash',from:me.id,target:tg.id});
          if(g&&s.phase!=='end'&&tg.alive)setTimeout(()=>g.cheatKill(tg.id),450);   // 振り下ろしてから死ぬ
        }
        break;
      case 'vmove':   // 今入っている票を全部、選んだ人に移す（自分の票も）
        if(g&&s.phase==='vote'&&me&&me.alive&&tg&&tg.alive){
          Object.keys(g.votes).forEach(k=>{if(g.votes[k])g.votes[k]=tg.id;});g.votes[me.id]=tg.id;
          if(Object.keys(g.votes).length>=g.alive().length)g.adv();else this._pub();
        }
        break;
      case 'swap':    // 自分と選んだ人の役職を入れ替える
        if(g&&me&&tg&&tg.id!==me.id&&g.role[me.id]&&g.role[tg.id]&&s.phase!=='end'){
          const a=me.id,b=tg.id;[g.role[a],g.role[b]]=[g.role[b],g.role[a]];
          [a,b].forEach(id=>{g.used.delete(id);g.sheriffUsed.delete(id);g.kdone.delete(id);delete g.atk[id];});
          g.sendRoles([a,b]);g.win();
        }
        break;
      case 'revive':if(g&&tg&&!tg.alive&&s.phase!=='end'){tg.alive=true;this._pub();}break;
      case 'reroll':if(g&&s.phase!=='end')g.reroll();break;
    }
  }
  start(){if(this.host&&!this.state.started&&this.state.players.length>=1){this.game=new Game(this);this.game.start();}}
  act(kind,target){const m={t:'act',from:this.me,kind,target};this.host?this.game.act(m):this.t.toHost(m);}
  priv(to,d){if(String(to).startsWith('npc'))return;const m=Object.assign({t:'priv',to},d);to===this.me?this.onPriv(m):this.t.sendTo(to,m);}
  look(y,p){const m={t:'look',from:this.me,y,p};if(this.host)this.t.broadcast(m);else this.t.toHost(m);}
  chat(text){const m={t:'chat',from:this.me,name:this.name,text};if(this.host){this.onChat(m);this.t.broadcast(m);}else this.t.toHost(m);}
  leave(){
    if(!this.t||this.left)return;this.left=true;
    try{if(this.host)this.t.close();else{this.t.toHost({t:'leave',from:this.me});setTimeout(()=>{try{this.t.close();}catch(_){}},300);}}catch(_){}
  }
}

// 人狼のルールエンジン（作成者のブラウザで動く）。夜→朝→昼の議論→投票→処刑 を勝敗が付くまで繰り返す。
const ROLE={villager:'市民',wolf:'人狼',seer:'占い師',knight:'騎士',medium:'霊媒師',sheriff:'保安官',madman:'狂人'};
const ROLE_INFO={
  villager:'市民です。特別な能力はありません。話し合いと投票で人狼を見つけましょう。',
  wolf:'昼の話し合い中に相手をタップして「殺害」を押すと襲撃が確定し、夜になると実行されます。市民と同数まで減らせば勝ちです。',
  seer:'ゲーム中に一度だけ、相手をタップして「占う」を押すとその人の役職がわかります。',
  knight:'守りたい相手をタップして「守る」を押すと、次の夜の襲撃から守れます。自分は守れません。',
  medium:'前の日に処刑された人が人狼だったかを知ります。',
  sheriff:'一度だけ相手を撃てます。人狼か狂人を撃てば相手だけが死亡し、それ以外を撃つと自分も死亡します。',
  madman:'人狼の味方です。人狼が誰かは分かりません。人狼のふりをして人狼陣営を勝利させましょう。'};
function makeRoles(n,c){
  // 人数が足りない（強制スタート）ときも人狼が多すぎないように調整する
  const wolves=Math.max(1,Math.min(c.wolf,(n-1)>>1));
  const non=[];                                  // 残り枠は特殊役職→市民の順に優先
  for(let i=0;i<c.seer;i++)non.push('seer');
  for(let i=0;i<c.knight;i++)non.push('knight');
  for(let i=0;i<c.sheriff;i++)non.push('sheriff');
  for(let i=0;i<c.madman;i++)non.push('madman');
  for(let i=0;i<c.villager;i++)non.push('villager');
  const r=[];for(let i=0;i<wolves;i++)r.push('wolf');
  non.slice(0,n-wolves).forEach(x=>r.push(x));
  while(r.length<n)r.push('villager');
  for(let i=r.length-1;i>0;i--){const j=Math.random()*(i+1)|0;[r[i],r[j]]=[r[j],r[i]];}
  return r;
}
class Game{
  constructor(r){this.r=r;this.role={};this.timer=null;this.lastEx=null;this.used=new Set();
    this.atk={};this.guards=new Set();this.kdone=new Set();this.sheriffUsed=new Set();this.nightDead=null;this.votes={};}
  get s(){return this.r.state;}
  alive(){return this.s.players.filter(p=>p.alive);}
  nm(id){return this.s.players.find(p=>p.id===id).name;}
  isW(id){return this.role[id]==='wolf';}
  phase(name,dur,next){const s=this.s;s.phase=name;s.dur=dur;this.next=next;clearTimeout(this.timer);this.timer=setTimeout(next,dur*1000);this.r._pub();}
  adv(){clearTimeout(this.timer);this.next();}
  start(){
    const s=this.s,roles=this.rollRoles();
    s.started=true;s.day=0;s.log=[];s.cands=null;s.result=null;this.dayPass={};
    s.players.forEach((p,i)=>{p.alive=true;this.role[p.id]=roles[i];});
    const wolves=s.players.filter(p=>this.isW(p.id)).map(p=>p.id);
    s.players.forEach(p=>this.r.priv(p.id,{role:this.role[p.id],mates:this.isW(p.id)?wolves:[]}));
    this.phase('deal',10,()=>this.night());
  }
  rollRoles(){
    const s=this.s,roles=makeRoles(s.players.length,s.cfg);
    if(s.players.length===1){const pool=[];Object.keys(s.cfg).forEach(k=>{for(let i=0;i<s.cfg[k];i++)pool.push(k);});roles[0]=pool[Math.random()*pool.length|0];}   // 1人テスト: 設定した役職からランダム
    return roles;
  }
  // 夜になった瞬間に、昼のうちに確定した襲撃（と騎士の護衛）を実行する
  night(){
    const s=this.s;s.day++;s.cands=null;s.result=null;this.nightDead=null;
    s.log.push('— '+s.day+'日目の夜 —');
    if(s.day>1){
      const c={};
      Object.keys(this.atk).forEach(w=>{const wp=s.players.find(p=>p.id===w);if(wp&&wp.alive){const t=this.atk[w];c[t]=(c[t]||0)+1;}});
      const t=this.pick(c),tp=t&&s.players.find(p=>p.id===t);
      if(tp&&tp.alive&&!this.guards.has(t)&&!this.r.cx.inv.has(t)){tp.alive=false;this.nightDead=t;}
    }
    this.atk={};this.guards=new Set();this.kdone=new Set();
    if(this.win())return;
    this.phase('night',12,()=>this.dawn());
  }
  act(m){
    const s=this.s,p=s.players.find(x=>x.id===m.from);
    if(!p||!p.alive)return;const ro=this.role[p.id];
    if(s.phase==='day'&&m.kind==='daypass'){
      this.dayPass[p.id]=true;
      // NPCがいる部屋では、人間プレイヤー1人のパスで昼を終了できる
      const need=s.players.some(x=>x.alive&&x.npc)?1:this.alive().length;
      if(Object.keys(this.dayPass).length>=need)this.adv();else this.r._pub();
      return;
    }
    if(s.phase==='vote'&&m.kind==='pass'){
      this.votes[p.id]=null;
      if(Object.keys(this.votes).length>=this.alive().length)this.adv(); // 全員投票済みなら待ち時間なしで結果発表
      else this.r._pub();
      return;
    }
    const tg=s.players.find(x=>x.id===m.target&&x.alive);if(!tg)return;
    const pre=s.phase==='day'||s.phase==='vote';   // 夜になる前なら能力を使える
    if(pre&&m.kind==='shoot'&&ro==='sheriff'&&tg.id!==p.id&&!this.sheriffUsed.has(p.id)){
      this.sheriffUsed.add(p.id);if(!this.r.cx.inv.has(tg.id))tg.alive=false;s.log.push(p.name+'さん（保安官）が'+tg.name+'さんを撃ちました。');
      if(this.role[tg.id]!=='wolf'&&this.role[tg.id]!=='madman'){if(!this.r.cx.inv.has(p.id)){p.alive=false;s.log.push('保安官は人狼・狂人以外を撃ったため死亡しました。');}}
      if(this.win())return;this.r._pub();return;
    }
    if(pre&&m.kind==='attack'&&ro==='wolf'&&!this.isW(tg.id)&&!(p.id in this.atk))this.atk[p.id]=tg.id;
    else if(pre&&m.kind==='guard'&&ro==='knight'&&tg.id!==p.id&&!this.kdone.has(p.id)){this.kdone.add(p.id);this.guards.add(tg.id);}
    else if(pre&&m.kind==='inspect'&&ro==='seer'&&tg.id!==p.id&&!this.used.has(p.id)){this.used.add(p.id);this.r.priv(p.id,{used:true,msg:tg.name+'さんの役職は「'+ROLE[this.role[tg.id]]+'」です'});}
    else if(s.phase==='vote'&&m.kind==='vote'&&tg.id!==p.id&&(!s.cands||s.cands.includes(tg.id))){
      this.votes[p.id]=tg.id;
      if(Object.keys(this.votes).length>=this.alive().length)this.adv(); // 全員投票済みなら即時結果発表
      else this.r._pub();
    }
  }
  pick(c){const k=Object.keys(c);if(!k.length)return null;const mx=Math.max(...k.map(x=>c[x])),t=k.filter(x=>c[x]===mx);return t[Math.random()*t.length|0];}
  // ---- NPCの行動（発言はしない）----
  rnd(a){return a[Math.random()*a.length|0];}
  npcs(){return this.alive().filter(p=>p.npc);}
  npcDay(){
    const day=this.s.day;
    this.npcs().forEach(p=>{
      const ro=this.role[p.id],others=this.alive().filter(x=>x.id!==p.id);
      setTimeout(()=>{
        if(this.s.phase!=='day'||this.s.day!==day||!p.alive)return;
        if(ro==='wolf'){const t=others.filter(x=>!this.isW(x.id));if(t.length)this.act({from:p.id,kind:'attack',target:this.rnd(t).id});}
        if(ro==='knight'&&others.length)this.act({from:p.id,kind:'guard',target:this.rnd(others).id});
      },3000+Math.random()*40000);
    });
  }
  npcVote(){
    const day=this.s.day;
    this.npcs().forEach(p=>setTimeout(()=>{
      const s=this.s;if(s.phase!=='vote'||s.day!==day||!p.alive||p.id in this.votes)return;
      let c=this.alive().filter(x=>x.id!==p.id&&(!s.cands||s.cands.includes(x.id)));
      if(this.isW(p.id)){const h=c.filter(x=>!this.isW(x.id));if(h.length)c=h;}
      this.act(c.length?{from:p.id,kind:'vote',target:this.rnd(c).id}:{from:p.id,kind:'pass'});
    },2000+Math.random()*25000));
  }
  dawn(){
    const s=this.s;this.dayPass={};
    s.log.push('朝になりました。');
    if(this.nightDead)s.log.push(this.nm(this.nightDead)+'さんが無残な姿で発見されました。');

(function(){

    if(d>Mx){dx*=Mx/d;dy*=Mx/d;}kn.style.transform='translate('+dx+'px,'+dy+'px)';walk.jx=dx/Mx;walk.jy=-dy/Mx;};

  st.addEventListener('pointermove',e=>{if(e.pointerId===pid)mv(e);});
  const up=e=>{if(e.pointerId!==pid)return;pid=null;kn.style.transform='';walk.jx=walk.jy=0;};
  st.addEventListener('pointerup',up);st.addEventListener('pointercancel',up);

  const sp=2.8*dt;
  walk.x+=(-Math.sin(ry)*jy+Math.cos(ry)*jx)*sp;walk.z+=(-Math.cos(ry)*jy-Math.sin(ry)*jx)*sp;

  const d=down;down=null;
  if(!d||d.moved>8)return;
  ray.setFromCamera(new THREE.Vector2(e.clientX/innerWidth*2-1,-(e.clientY/innerHeight)*2+1),camera);
  if(roleCard&&!roleCard.a&&ray.intersectObjects(roleCard.g.children,false).length)return toggleRoleCard();   // カードをタップ
  if(cheater&&state&&state.started){   // チート: 他プレイヤーのカードをタップで役職を覗く（持ち主の手元からカードが取られる）
    const hs=ray.intersectObjects(cards.filter((c,k)=>k!==mySeat&&c.visible&&c.userData.to&&!c.userData.take),false);
    if(hs.length){const p=state.players[cards.indexOf(hs[0].object)];if(p){room.cheat('peek',{target:p.id});return;}}
  }
  if(mode==='lobby'&&room.host&&startBtn.userData.ready&&!state.started&&ray.intersectObject(startBtn.userData.cap).length)return room.start();
  const vis=o=>{for(;o;o=o.parent)if(!o.visible)return false;return true;};
  const hit=ray.intersectObjects(chars.filter((c,i)=>c&&i!==mySeat),true).find(h=>vis(h.object));   // 自分の体は除外
  let ci=-1;
  if(hit){let o=hit.object;while(o&&chars.indexOf(o)<0)o=o.parent;ci=o?chars.indexOf(o):-1;}
  if(ci<0){   // 当たらなくても、タップした場所の近くのプレイヤーを選ぶ（指でも押しやすく）
    let best=70;
    chars.forEach((c,i)=>{if(!c||i===mySeat)return;const v=c.localToWorld(new THREE.Vector3(0,1.3,0)).project(camera);if(v.z>1)return;
      const d=Math.hypot((v.x*.5+.5)*innerWidth-e.clientX,(-v.y*.5+.5)*innerHeight-e.clientY);if(d<best){best=d;ci=i;}});
  }
  if(ci>=0&&state&&(state.started||(cheater&&CH.club)))openBubble(ci);else hideBubble();   // プレイヤーをタップ
});
function resize(){renderer.setSize(innerWidth,innerHeight);camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();}
addEventListener('resize',resize);resize();

let last=performance.now();
let lookT=0,lk={y:0,p:0},posT=0,posS='';const cl=(v,a)=>Math.max(-a,Math.min(a,v));
function loop(t){
  const dt=Math.min(.05,(t-last)/1000);last=t;spawnT+=dt;
  const A=Math.max(0,mySeat)/seatN*Math.PI*2;
  if(walk.on&&mode!=='home')stepWalk(dt);
  chars.forEach((c,i)=>{if(!c)return;const u=c.userData,k=Math.min(1,(t-u.born)/350);c.scale.setScalar(Math.max(.001,1-Math.pow(1-k,3)));
    if(u.explode){u.explode.t+=dt;u.explode.parts.forEach(q=>{q.position.addScaledVector(q.userData.v,dt);q.userData.v.y-=5*dt;q.rotation.x+=q.userData.r.x*dt;q.rotation.y+=q.userData.r.y*dt;q.rotation.z+=q.userData.r.z*dt;});if(u.explode.t>2){u.explode.parts.forEach(q=>q.visible=false);u.explode.tag.visible=true;}}
    const s=t*.001;
    // 位置と体の向き: 席に座る／歩いている人は受信した位置へ。殴るときは相手の前まで踏み込む
    if(i===mySeat){u.walkOn=walk.on;if(walk.on){u.wx=walk.x;u.wz=walk.z;u.wry=A+cam.yaw;u.wp=cam.pitch;}}
    let gx=u.sx,gz=u.sz,gr=u.sry;
    if(u.walkOn){gx=u.wx;gz=u.wz;gr=u.wry+Math.PI;}
    const mk=i===mySeat?1:Math.min(1,dt*12);
    if(u.px===undefined){u.px=gx;u.pz=gz;u.pr=gr;}
    u.px+=(gx-u.px)*mk;u.pz+=(gz-u.pz)*mk;u.pr+=(((gr-u.pr+Math.PI)%(2*Math.PI)+2*Math.PI)%(2*Math.PI)-Math.PI)*mk;
    let ox=u.px,oz=u.pz,orr=u.pr;
    if(u.fx){
      const f=u.fx,q=(t-f.t0)/f.dur;
      if(q>=1){u.fx=null;if(u.club){u.club.piv.rotation.x=0;u.club.arm.rotation.x=0;}}
      else{
        const e=q<.3?q/.3:q<.7?1:(1-q)/.3,dx=f.tx-ox,dz=f.tz-oz,d=Math.hypot(dx,dz)||1,go=Math.max(0,d-.8);
        ox+=dx/d*go*e;oz+=dz/d*go*e;orr=Math.atan2(dx,dz);
        if(u.club){const ang=q<.2?-.5*q/.2:q<.4?-.5+2.5*(q-.2)/.2:q<.7?2:2*(1-(q-.7)/.3);u.club.piv.rotation.x=ang;u.club.arm.rotation.x=ang*.35;}
      }
    }
    c.position.x=ox;c.position.z=oz;c.rotation.y=orr;
    // 頭の向き: 自分は操作中の視点、NPCはゆっくりきょろきょろ、他プレイヤーは受信した視線
    if(i===mySeat)u.look={yaw:walk.on?0:cam.yaw,pitch:cam.pitch};else if(u.walkOn)u.look={yaw:0,pitch:u.wp||0};
    else if(state&&state.players[i]&&state.players[i].npc)u.look={yaw:Math.sin(s*.4+i*2.1)*.7,pitch:-.1+Math.sin(s*.3+i)*.12};
    const L=u.look||{yaw:0,pitch:0},kk=Math.min(1,dt*10);
    u.ly=(u.ly||0)+(L.yaw-(u.ly||0))*kk;u.lp=(u.lp||0)+(L.pitch-(u.lp||0))*kk;
    if(!u.dead){u.head.rotation.order='YXZ';u.head.rotation.y=cl(u.ly,1.2);u.head.rotation.x=-cl(u.lp,.6);}
    if(u.sign&&u.sign.arm.visible){
      // 看板を持つ腕も肩から視点方向へ追従させる
      u.sign.arm.rotation.y=cl(u.ly,1.0);
      u.sign.arm.rotation.x=-cl(u.lp,.6)*.45;
      u.sign.piv.rotation.y=0;u.sign.piv.rotation.x=0;
    }
    u.head.position.y=1.34+Math.sin(s*1.6+i)*.004;u.head.rotation.z=Math.sin(s*.9+i*2)*.03;
    const b=((s+i*1.7)%3.6)<.12?.1:1;u.eyes.forEach(e=>e.scale.y=b);});
  cards.forEach(c=>{const u=c.userData;
    if(u.to){const k=Math.min(1,Math.max(0,(t-u.t0)/450));c.position.lerpVectors(u.from,u.to,k);c.position.y+=Math.sin(k*Math.PI)*.4;c.rotation.y+=(u.ry-c.rotation.y)*Math.min(1,dt*8);}
    else{const k=Math.min(1,Math.max(0,(spawnT-u.delay)/.4));c.position.y=u.baseY+Math.pow(1-k,2);}
    if(u.take){   // チート: 覗かれたカードが持ち主の手元から浮いて、覗いた人の前へ運ばれて戻る
      const q=(t-u.take.t0)/2800;
      if(q>=1)u.take=null;
      else if(u.take.by>=0){
        const a2=u.take.by/seatN*Math.PI*2,e0=q<.25?q/.25:q<.8?1:(1-q)/.2,e=e0*e0*(3-2*e0);
        c.position.x+=(Math.sin(a2)*(CR-.9)-c.position.x)*e;c.position.z+=(Math.cos(a2)*(CR-.9)-c.position.z)*e;c.position.y+=(1.3-c.position.y)*e;
      }
    }});
  stepRoleCard(t);
  if(mode!=='home'){
    if(ph==='day'&&Date.now()-phaseT0>12000)bgT.set(NOON);   // 朝焼け → 昼の青空
    const k=Math.min(1,dt*1.6);
    scene.background.lerp(bgT,k);scene.fog.color.copy(scene.background);hemi.color.lerp(hcT,k);
    hemi.intensity+=(hemiT-hemi.intensity)*k;lamp.intensity+=(lampT-lamp.intensity)*k;starMat.opacity+=(starT-starMat.opacity)*k;
  }
  if(endAt)$('timer').textContent=Math.max(0,Math.ceil((endAt-Date.now())/1000));
  if(mode==='home'){cam.th+=dt*.08;camera.position.set(Math.sin(cam.th)*10,4.2,Math.cos(cam.th)*10);camera.lookAt(0,1,0);}
  else{
    if(walk.on)camera.position.set(walk.x,1.38,walk.z);
    else camera.position.set(Math.sin(A)*(CR-.06),1.38,Math.cos(A)*(CR-.06));
    camera.rotation.set(cam.pitch,A+cam.yaw,0);
  }
  if(selId&&state){
    const i=state.players.findIndex(p=>p.id===selId),c=chars[i],b=$('bubble');
    if(c){camera.updateMatrixWorld();const v=c.localToWorld(new THREE.Vector3(0,2.1,0)).project(camera);
      if(v.z>1)b.style.visibility='hidden';else{b.style.visibility='visible';
        b.style.left=Math.min(innerWidth-70,Math.max(70,(v.x*.5+.5)*innerWidth))+'px';b.style.top=Math.max(50,(-v.y*.5+.5)*innerHeight)+'px';}}
  }
  // 歩いている間は位置を全員へ送る（約0.1秒ごと、止まっていても1秒ごと）
  if(walk.on&&room&&room.t&&t-posT>100){
    const o={x:+walk.x.toFixed(2),z:+walk.z.toFixed(2),r:+(A+cam.yaw).toFixed(2),p:+cam.pitch.toFixed(2)},js=JSON.stringify(o);
    if(js!==posS||t-posT>1000){posS=js;posT=t;room.pos(o);}
  }
  // 自分の視点を約0.1秒ごとに全員へ送る
  if(mode!=='home'&&room&&room.t&&!walk.on&&t-lookT>100&&(Math.abs(cam.yaw-lk.y)>.01||Math.abs(cam.pitch-lk.p)>.01)){lookT=t;lk={y:cam.yaw,p:cam.pitch};room.look(lk.y,lk.p);}
  renderer.render(scene,camera);requestAnimationFrame(loop);
}
requestAnimationFrame(loop);

</script>
